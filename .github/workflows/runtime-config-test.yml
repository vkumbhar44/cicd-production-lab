name: Runtime Configuration Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-config-test:
    name: Test Runtime Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t cicd-production-lab:runtime-test .

      - name: Run development container
        run: |
          docker run -d \
            --name cicd-dev \
            -p 5001:5000 \
            -e APP_ENV=development \
            -e LOG_LEVEL=DEBUG \
            cicd-production-lab:runtime-test

      - name: Run production container
        run: |
          docker run -d \
            --name cicd-prod \
            -p 5002:5000 \
            -e APP_ENV=production \
            -e LOG_LEVEL=WARNING \
            cicd-production-lab:runtime-test

      - name: Verify development container
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5001/health; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:5001/health

          docker logs cicd-dev 2>&1 | \
            grep -F "environment=development, log_level=DEBUG"

      - name: Verify production container
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:5002/health; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:5002/health

          

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f cicd-dev cicd-prod || true